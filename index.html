<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAKTAR - Consulta de Deuda</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f7fa;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.10);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    max-width:250px;
}

h1{
    text-align:center;
    color:#0d4f8b;
    margin-bottom:30px;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#0d4f8b;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#08365f;
}

#mensaje{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:5px;
    background:#e8f7e8;
    color:#216e21;
    font-weight:bold;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

<div class="logo">
    <img-paktar.jpg
</div>

<h1>Consulta de Deuda</h1>

<form id="consultaForm">

<input type="text" placeholder="Nombre y Apellido" required>

<input type="text" placeholder="DNI" required>

<input type="text" placeholder="Teléfono" required>

<select id="cartera" required>

<option value="">Seleccione una cartera</option>

<option value="BSF">BSF</option>
<option value="EDESUR">EDESUR</option>
<option value="PATAGONIA">PATAGONIA</option>
<option value="SMG">SMG</option>
<option value="TARJETA PLATA">TARJETA PLATA</option>
<option value="CREDITOP">CREDITOP</option>
<option value="CREDIPAZ">CREDIPAZ</option>
<option value="CENCOSUD">CENCOSUD</option>
<option value="ADT">ADT</option>
<option value="BRUBANK">BRUBANK</option>
<option value="CREDITECH">CREDITECH</option>

</select>

<button type="submit">Derivar Consulta</button>

</form>

<div id="mensaje">
✅ Su consulta fue derivada correctamente.<br>
Un operador especializado se comunicará con usted a la brevedad.
</div>

</div>

<script>

document.getElementById("consultaForm").addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("mensaje").style.display = "block";

    setTimeout(function(){

        window.open(
            "https://wa.me/5491154895952?text=Hola,%20realic%C3%A9%20una%20consulta%20desde%20la%20web%20de%20PAKTAR",
            "_blank"
        );

    }, 1500);

});

</script>

</body>
</html>
