<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta PAKTAR</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:10px;
    width:400px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h2{
    color:#1f4e79;
    text-align:center;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#1f4e79;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:15px;
}

#mensaje{
    margin-top:20px;
    color:green;
    font-weight:bold;
    text-align:center;
}
</style>
</head>

<body>

<div class="card">

<h2>Consulta de Deuda PAKTAR</h2>

<form id="consultaForm">

<input type="text" placeholder="Nombre y apellido" required>

<input type="text" placeholder="DNI" required>

<input type="text" placeholder="Teléfono" required>

<select id="cartera" required>
<option value="">Seleccione una cartera</option>
<option>BSF</option>
<option>EDESUR</option>
<option>PATAGONIA</option>
<option>SMG</option>
<option>TARJETA PLATA</option>
<option>CREDITOP</option>
<option>CREDIPAZ</option>
<option>CENCOSUD</option>
<option>ADT</option>
<option>BRUBANK</option>
<option>CREDITECH</option>
</select>

<button type="submit">Derivar consulta</button>

</form>

<div id="mensaje"></div>

</div>

<script>
document.getElementById("consultaForm").addEventListener("submit", function(e){
e.preventDefault();

document.getElementById("mensaje").innerHTML =
"✅ Su consulta fue derivada correctamente. Un operador se comunicará con usted a la brevedad.";
});
</script>

</body>
</html>
