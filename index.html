<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAKTAR - Consulta de Deuda</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f7fa;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.15);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    max-width:250px;
}

h1{
    text-align:center;
    color:#0d4f8b;
}

input,select{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    background:#0d4f8b;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#08365f;
}

#mensaje{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#e8f7e8;
    color:#216e21;
    border-radius:6px;
    text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
    <img src="paktar.png" alt="PAKTAR">
</div>

<h1>Consulta de Deuda</h1>

<form id="consultaForm">

<input id="nombre" type="text" placeholder="Nombre y Apellido" required>

<input id="dni" type="text" placeholder="DNI" required>

<input id="telefono" type="text" placeholder="Teléfono" required>

<select id="cartera" required>
    <option value="">Seleccione una cartera</option>

    <option value="EDESUR">EDESUR</option>
    <option value="PATAGONIA">PATAGONIA</option>
    <option value="SMG">SMG</option>
    <option value="CREDIPAZ">CREDIPAZ</option>
    <option value="CENCOSUD">CENCOSUD</option>
    <option value="BRUBANK">BRUBANK</option>
    <option value="CREDITECH">CREDITECH</option>
    <option value="DIRECTO">DIRECTO</option>
</select>

<button type="submit">
Derivar Consulta
</button>

</form>

<div id="mensaje">
✅ Su consulta fue derivada correctamente.<br>
Un operador especializado se comunicará con usted a la brevedad.
</div>

</div>

<script>

document.getElementById("consultaForm").addEventListener("submit", function(e){

e.preventDefault();

let nombre = document.getElementById("nombre").value;
let dni = document.getElementById("dni").value;
let telefono = document.getElementById("telefono").value;
let cartera = document.getElementById("cartera").value;

const ahora = new Date();
const hora = ahora.getHours();
const minuto = ahora.getMinutes();

let turno = "manana";

if (hora > 14 || (hora === 14 && minuto >= 30)) {
    turno = "tarde";
}

const numeros = {

    EDESUR: {
        manana: "5491164139414",
        tarde: "5491164139414"
    },

    PATAGONIA: {
        manana: "5491125997626",
        tarde: "5491144408132"
    },

    SMG: {
        manana: "5491124077959",
        tarde: "5491126816885"
    },

    CREDIPAZ: {
        manana: "5491173656691",
        tarde: "5491139085804"
    },

    CENCOSUD: {
        manana: "5491138610715",
        tarde: "5491138610715"
    },

    BRUBANK: {
        manana: "5491165950797",
        tarde: "5491164890040"
    },

    CREDITECH: {
        manana: "5491151322304",
        tarde: "5491135599509"
    },

    DIRECTO: {
        manana: "5491153763671",
        tarde: "5491172375051"
    }

};

let numeroDestino = numeros[cartera][turno];

document.getElementById("mensaje").style.display = "block";

setTimeout(function(){

window.location.href =
"https://wa.me/" + numeroDestino + "?text=" +
encodeURIComponent(
"Nueva consulta web PAKTAR\n\n" +
"Cartera: " + cartera + "\n" +
"Turno: " + turno + "\n\n" +
"Nombre y Apellido: " + nombre + "\n" +
"DNI: " + dni + "\n" +
"Telefono: " + telefono + "\n\n" +
"Solicita contacto por consulta de deuda."
);

},1500);
``
});

</script>

</body>
</html>
